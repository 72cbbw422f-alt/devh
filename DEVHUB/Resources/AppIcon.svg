<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#070B1C"/><stop offset=".55" stop-color="#101A38"/><stop offset="1" stop-color="#090F25"/>
  </linearGradient>
  <radialGradient id="ambience" cx=".5" cy=".48" r=".55">
    <stop stop-color="#5145C9" stop-opacity=".42"/><stop offset=".55" stop-color="#263D8B" stop-opacity=".16"/><stop offset="1" stop-color="#101A38" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#53D8E8"/><stop offset=".48" stop-color="#8B7CFF"/><stop offset="1" stop-color="#398BFF"/>
  </linearGradient>
  <linearGradient id="hub" x1=".15" y1="0" x2=".85" y2="1">
    <stop stop-color="#B8AEFF"/><stop offset=".42" stop-color="#7869FF"/><stop offset="1" stop-color="#287FEA"/>
  </linearGradient>
  <linearGradient id="nodeA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7BEAF0"/><stop offset="1" stop-color="#398BFF"/></linearGradient>
  <linearGradient id="nodeB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B7A9FF"/><stop offset="1" stop-color="#6254D9"/></linearGradient>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="13" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
</defs>
<!-- Deep midnight glass field -->
<rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
<rect x="18" y="18" width="988" height="988" rx="210" fill="url(#ambience)"/>
<circle cx="512" cy="500" r="340" fill="#7164F2" opacity=".13" filter="url(#softGlow)"/>
<circle cx="512" cy="512" r="342" fill="none" stroke="#8C9BFF" stroke-width="2" opacity=".10"/>
<circle cx="512" cy="512" r="286" fill="none" stroke="#5B72C8" stroke-width="2" opacity=".12"/>
<!-- Network shadow and luminous paths -->
<g fill="none" stroke="#05091A" stroke-width="58" stroke-linecap="round" stroke-linejoin="round" opacity=".55" transform="translate(0 12)" filter="url(#shadow)">
  <path d="M512 490 L512 286 Q512 238 464 238 L330 238"/>
  <path d="M534 490 L716 386 Q758 362 758 314 L758 274"/>
  <path d="M490 534 L338 622 Q296 646 296 694 L296 750"/>
  <path d="M534 534 L684 686 Q718 720 766 720 L792 720"/>
</g>
<g fill="none" stroke="url(#wire)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
  <path d="M512 490 L512 286 Q512 238 464 238 L330 238"/>
  <path d="M534 490 L716 386 Q758 362 758 314 L758 274"/>
  <path d="M490 534 L338 622 Q296 646 296 694 L296 750"/>
  <path d="M534 534 L684 686 Q718 720 766 720 L792 720"/>
</g>
<g fill="none" stroke="#D9D6FF" stroke-width="5" stroke-linecap="round" opacity=".42">
  <path d="M512 490 L512 286 Q512 238 464 238 L330 238"/>
  <path d="M534 490 L716 386 Q758 362 758 314 L758 274"/>
  <path d="M490 534 L338 622 Q296 646 296 694 L296 750"/>
  <path d="M534 534 L684 686 Q718 720 766 720 L792 720"/>
</g>
<!-- Satellite nodes -->
<g filter="url(#glow)">
  <circle cx="330" cy="238" r="76" fill="#43C8E5" opacity=".18"/>
  <circle cx="330" cy="238" r="52" fill="url(#nodeA)"/>
  <circle cx="330" cy="238" r="26" fill="#E8FFFF"/>
  <circle cx="758" cy="274" r="76" fill="#398BFF" opacity=".18"/>
  <circle cx="758" cy="274" r="52" fill="url(#nodeA)"/>
  <circle cx="758" cy="274" r="25" fill="#EAF4FF"/>
  <circle cx="296" cy="750" r="76" fill="#7164F2" opacity=".2"/>
  <circle cx="296" cy="750" r="52" fill="url(#nodeB)"/>
  <circle cx="296" cy="750" r="25" fill="#F0EDFF"/>
  <circle cx="792" cy="720" r="72" fill="#7164F2" opacity=".18"/>
  <circle cx="792" cy="720" r="48" fill="url(#nodeB)"/>
  <circle cx="792" cy="720" r="22" fill="#F0EDFF"/>
</g>
<!-- Central intelligence hub -->
<circle cx="512" cy="512" r="174" fill="#5145D7" opacity=".20" filter="url(#softGlow)"/>
<circle cx="512" cy="512" r="132" fill="#0C1430" stroke="#9B91FF" stroke-width="8" opacity=".98"/>
<circle cx="512" cy="512" r="112" fill="url(#hub)" filter="url(#glow)"/>
<circle cx="512" cy="512" r="82" fill="none" stroke="#E7E4FF" stroke-width="4" opacity=".48"/>
<path d="M512 440 L570 474 L570 550 L512 584 L454 550 L454 474 Z" fill="#F5F4FF" opacity=".95"/>
<path d="M512 458 L554 482 L554 536 L512 560 L470 536 L470 482 Z" fill="url(#hub)"/>
<circle cx="512" cy="509" r="19" fill="#F7FBFF"/>
<!-- restrained glass highlight -->
<path d="M245 180 Q512 82 779 180" fill="none" stroke="#C8D2FF" stroke-width="5" opacity=".08" stroke-linecap="round"/>
</svg>