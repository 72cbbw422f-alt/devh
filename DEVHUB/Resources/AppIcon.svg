<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B1C"/><stop offset=".55" stop-color="#101A38"/><stop offset="1" stop-color="#090F25"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#7164F2" stop-opacity=".5"/><stop offset="1" stop-color="#7164F2" stop-opacity="0"/></radialGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8CEBFF"/><stop offset=".5" stop-color="#35A9EE"/><stop offset="1" stop-color="#2875D7"/></linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9D5F0"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18264C"/><stop offset="1" stop-color="#080F27"/></linearGradient>
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
<circle cx="512" cy="510" r="430" fill="url(#glow)"/>
<ellipse cx="512" cy="866" rx="260" ry="48" fill="#7164F2" opacity=".42" filter="url(#shadow)"/>
