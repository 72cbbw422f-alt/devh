name: DEVHUB iOS Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DEVHUB/**'
      - 'project.yml'
      - '.github/workflows/ios-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare app icon
        run: |
          python3 -m pip install --quiet cairosvg
          mkdir -p DEVHUB/Assets.xcassets/AppIcon.appiconset
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='DEVHUB/Assets.xcassets/AppIcon.appiconset/AppIcon.svg',
                           write_to='DEVHUB/Assets.xcassets/AppIcon.appiconset/AppIcon.png',
                           output_width=1024, output_height=1024)
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          xcodebuild -project DEVHUB.xcodeproj -scheme DEVHUB -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DEVHUB.app Payload/
          zip -r DEVHUB-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: DEVHUB-unsigned-ipa
          path: DEVHUB-unsigned.ipa
          retention-days: 14
