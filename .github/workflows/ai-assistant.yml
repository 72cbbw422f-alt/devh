name: DEVHUB AI Assistant

on:
  workflow_dispatch:
    inputs:
      project_repository:
        description: Project repository to inspect
        required: true
        type: choice
        options:
          - 72cbbw422f-alt/project-orbit
          - 72cbbw422f-alt/fam
          - 72cbbw422f-alt/binge
          - 72cbbw422f-alt/vill
          - 72cbbw422f-alt/hem
          - 72cbbw422f-alt/devh
      task:
        description: What should the assistant investigate?
        required: true
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze project with AI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing OPENAI_API_KEY repository secret."
            exit 1
          fi

      - name: Check out selected project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.project_repository }}
          ref: main
          path: project

      - name: Build project context
        id: context
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          allowed = {".swift", ".md", ".yml", ".yaml", ".json", ".plist", ".txt"}
          ignored = {".git", "Pods", "build", "DerivedData", ".build", "node_modules"}
          chunks = []
          total = 0
          for path in sorted(Path(".").rglob("*")):
              if not path.is_file() or any(part in ignored for part in path.parts):
                  continue
              if path.suffix.lower() not in allowed and path.name not in {"Package.swift", "project.yml"}:
                  continue
              try:
                  body = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              chunk = f"\n\n===== {path} =====\n{body[:10000]}"
              chunks.append(chunk)
              total += len(chunk)
              if total >= 45000:
                  break
          context = "".join(chunks) or "No supported source files were found."
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("context<<DEVHUB_CONTEXT\n")
              output.write(context[:50000])
              output.write("\nDEVHUB_CONTEXT\n")
          PY

      - name: Analyze with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TASK: ${{ inputs.task }}
          PROJECT_REPOSITORY: ${{ inputs.project_repository }}
          PROJECT_CONTEXT: ${{ steps.context.outputs.context }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          system = """You are DEVHUB, a careful software engineering assistant.
          Analyze only the supplied repository context. Distinguish verified findings from hypotheses.
          Cite exact file paths, suggest safe next steps, and never claim to modify files.
          Reply in Swedish unless asked otherwise."""
          payload = {
              "model": "gpt-6.2-sol",
              "input": [
                  {"role": "system", "content": system},
                  {"role": "user", "content": "Repository: " + os.environ["PROJECT_REPOSITORY"] +
                   "\nTask: " + os.environ["TASK"] +
                   "\n\nSource context:\n" + os.environ["PROJECT_CONTEXT"]}
              ],
              "max_output_tokens": 1800
          }
          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode(),
              headers={"Authorization": "Bearer " + os.environ["OPENAI_API_KEY"],
                       "Content-Type": "application/json"},
              method="POST")
          try:
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = json.loads(response.read())
          except urllib.error.HTTPError as error:
              detail = error.read().decode(errors="replace")[:1500]
              raise SystemExit("OpenAI API error " + str(error.code) + ": " + detail)
          answer = "\n\n".join(
              part.get("text", "")
              for item in data.get("output", []) if item.get("type") == "message"
              for part in item.get("content", []) if part.get("type") == "output_text"
          ).strip()
          if not answer:
              raise SystemExit("The AI response did not contain readable output.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("# DEVHUB AI analysis\n\n")
              summary.write("**Project:** " + os.environ["PROJECT_REPOSITORY"] + "\n\n")
              summary.write("**Task:** " + os.environ["TASK"] + "\n\n")
              summary.write(answer + "\n")
          with open("analysis.md", "w", encoding="utf-8") as result:
              result.write("# DEVHUB AI analysis\n\n")
              result.write("**Project:** " + os.environ["PROJECT_REPOSITORY"] + "\n\n")
              result.write("**Task:** " + os.environ["TASK"] + "\n\n")
              result.write(answer + "\n")
          print("AI analysis completed and saved as analysis.md.")
          PY

      - name: Upload AI result
        uses: actions/upload-artifact@v4
        with:
          name: devhub-ai-result
          path: analysis.md
          retention-days: 14
          PY
