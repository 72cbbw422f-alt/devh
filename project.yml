name: DEVHUB
options:
  bundleIdPrefix: se.niklas
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    GENERATE_INFOPLIST_FILE: YES
targets:
  DEVHUB:
    type: application
    platform: iOS
    sources:
      - path: DEVHUB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.niklas.devhub
        PRODUCT_NAME: DEVHUB
        INFOPLIST_KEY_CFBundleDisplayName: DEVHUB
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
